<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Farm Fresh Direct</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: #f3f9f5; color: #1f2937;
    display: flex; align-items: center; justify-content: center; text-align: center;
    padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom);
    box-sizing: border-box;
  }
  .logo { width: 72px; height: 72px; border-radius: 20px; display: block; margin: 0 auto 20px; }
  h1 { font-size: 22px; margin: 0 0 8px; color: #065f46; }
  p { font-size: 16px; line-height: 1.5; margin: 0 0 24px; color: #545b67; max-width: 320px; }
  button {
    font: inherit; font-weight: 600; color: #fff; background: #059669;
    border: 0; border-radius: 12px; padding: 12px 28px;
  }
  button:active { background: #047857; }
</style>
</head>
<body>
  <main>
    <img class="logo" src="icon.png" alt="">
    <h1>You're offline</h1>
    <p>Farm Fresh Direct needs an internet connection. Check your Wi-Fi or cell signal, then try again.</p>
    <button type="button" onclick="location.replace('https://www.farmfreshdirect.online/')">Try again</button>
  </main>
</body>
</html>
